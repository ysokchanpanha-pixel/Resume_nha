<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Template</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #f4f4f4;
        padding: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    td {
        padding: 50px;
        vertical-align: top;
    }

    h1 {
        margin-top: 0;
    }

    p.title {
        font-weight: bold;
        font-size: 1.2em;
        color: #0b04ea;
    }

    h1.ti1 {

        color: #0b04ea;
    }

    p.b1 {

        font-size: 1.2em;
        color: #17ca32;
    }

    .skills-list {
        margin: 0;
        padding-left: 20px;
        list-style-type: disc;
        color: #000;
    }

    .skills-list li {
        margin: 6px 0;
        color: #000;
    }
</style>

<body>
    <header>
        <table>
            <tr>

                <td>
                    <h1>Yeom Sokchanpanha</h1>

                    <p class="title">Frontend Developer</p>
                    <p> Street2004 </p>
                    <p> phnom penh </p>
                    <p> sokchanpanhayim@gmail.com </p>
                </td>
                <td><img src="image.png" alt="Profile Picture" width="150"></td>
            </tr>

            <tr>

                <td>

                    <h1 class="ti1">Skill</h1>
                    <ul class="skills-list">
                        <li>HTML</li>
                        <li>Accessibility</li>
                        <li>Design</li>
                        <li>Responsive Web Design</li>
                        <li>Technical Writing</li>
                        <li>Presentation</li>
                    </ul>
                </td>
            </tr>

            <tr>
                <td>
                    <h1 class="ti1">Education</h1>
                    <p class="b1">Bachelor of Science in Computer Science</p>
                    <p> bacll 2024</p>

                </td>
            </tr>
        </table>

    </header>
</body>

</html>
